<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>방명록</title>
    <!--
      AI 스타터: 나루 데이터베이스를 쓰는 가장 작은 앱입니다.
      AI에게 고쳐 달라고 할 때는 https://naru.pub/docs/ai 의 안내문을 먼저
      붙여 넣고, 이 파일과 _naru/collections.json을 함께 보여 주세요.
    -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>방명록</h1>
      <p class="lead">한 줄 남기고 가세요.</p>

      <form id="form">
        <input id="name" placeholder="이름" maxlength="30" required />
        <textarea
          id="message"
          placeholder="남길 말"
          maxlength="500"
          rows="3"
          required
        ></textarea>
        <button>남기기</button>
        <p id="status" role="status"></p>
      </form>

      <ul id="entries"></ul>
      <button id="more" hidden>더 보기</button>

      <footer>
        <button id="login" class="link">주인 로그인</button>
        <button id="logout" class="link" hidden>로그아웃</button>
      </footer>
    </main>

    <script type="module">
      import { createNaru } from "https://sdk.naru.pub/sdk/1.0.0/naru.js";

      // guestbook: 누구나 읽고, 누구나 새 글만 남깁니다(_naru/collections.json).
      const naru = createNaru();
      const $ = (selector) => document.querySelector(selector);

      // 주인으로 로그인했으면 글을 지울 수 있습니다.
      const admin = await naru.auth.session();
      $("#login").hidden = !!admin;
      $("#logout").hidden = !admin;
      $("#login").onclick = () =>
        naru.auth.signIn({ collections: ["guestbook"] });
      $("#logout").onclick = async () => {
        await admin.signOut();
        location.reload();
      };

      const query = { sort: [[{ metadata: "createdAt" }, "desc"]], size: 20 };
      let cursor = null;

      function render(entry) {
        const item = document.createElement("li");
        const name = document.createElement("strong");
        name.textContent = entry.data.name;
        const time = document.createElement("time");
        time.textContent = new Date(entry.createdAt).toLocaleString("ko-KR");
        const message = document.createElement("p");
        message.textContent = entry.data.message;
        item.append(name, time, message);
        if (admin) {
          const remove = document.createElement("button");
          remove.className = "link";
          remove.textContent = "지우기";
          remove.onclick = async () => {
            if (!confirm("이 글을 지울까요?")) return;
            await admin.collection("guestbook").delete(entry.id);
            item.remove();
          };
          item.append(remove);
        }
        return item;
      }

      async function load() {
        $("#more").disabled = true;
        try {
          const page = await naru
            .collection("guestbook")
            .list({ ...query, after: cursor });
          $("#entries").append(...page.documents.map(render));
          cursor = page.nextCursor;
          $("#more").hidden = !cursor;
        } catch (error) {
          $("#status").textContent = "글을 불러오지 못했습니다.";
          console.error(error);
        } finally {
          $("#more").disabled = false;
        }
      }
      $("#more").onclick = load;

      $("#form").onsubmit = async (event) => {
        event.preventDefault();
        const button = $("#form button");
        button.disabled = true;
        $("#status").textContent = "";
        try {
          const saved = await naru.collection("guestbook").add({
            name: $("#name").value.trim(),
            message: $("#message").value.trim(),
          });
          $("#entries").prepend(render(saved));
          $("#message").value = "";
        } catch (error) {
          $("#status").textContent =
            error.code === "RATE_LIMITED"
              ? "잠시 후 다시 남겨 주세요."
              : "남기지 못했습니다. 다시 시도해 주세요.";
          console.error(error);
        } finally {
          button.disabled = false;
        }
      };

      await load();
    </script>
  </body>
</html>
