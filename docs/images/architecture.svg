<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="840" viewBox="0 0 1110 840" role="img" aria-labelledby="title desc">
  <title id="title">나루의 구조</title>
  <desc id="desc">한국의 브라우저는 사이트 페이지를 Cloudflare의 엣지 Worker에서 받고, 관리 화면(naru.pub)과 Data SDK(sdk.naru.pub, 파일과 데이터)는 Cloudflare를 거치지 않고 맥 미니의 Caddy에 바로 연결합니다. Caddy는 naru.pub을 nginx 게이트웨이와 control plane으로, sdk.naru.pub을 workerd로 보냅니다. Toss와 GitHub의 웹훅도 같은 길로 옵니다. 사이트 데이터베이스는 맥 미니에만 있고, Backblaze B2에 백업됩니다.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
    .bg { fill: #ffffff; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .band-cf { fill: #fff7ed; stroke: #fdba74; }
    .band-mini { fill: #f0f9ff; stroke: #7dd3fc; }
    .band-title { font-size: 14px; font-weight: 700; fill: #1f2328; }
    .band-sub { font-size: 12px; fill: #59636e; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .box-ext { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .box-user { fill: #1f2328; stroke: none; }
    .title { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 11.5px; fill: #59636e; }
    .user-title { font-size: 14px; font-weight: 600; fill: #ffffff; }
    .user-sub { font-size: 11.5px; fill: #d1d9e0; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.4; }
    .line-direct { fill: none; stroke: #0969da; stroke-width: 2; }
    .dash { stroke-dasharray: 5 4; }
    .label { font-size: 11px; fill: #59636e; }
    .label-direct { font-size: 11px; font-weight: 600; fill: #0969da; }
    .head { fill: #57606a; }
    .head-direct { fill: #0969da; }
    .life { stroke: #d0d7de; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .msg { font-size: 12px; fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .band { fill: #161b22; stroke: #30363d; }
      .band-cf { fill: #241a10; stroke: #9a5b1f; }
      .band-mini { fill: #0f1d2b; stroke: #1f6f9f; }
      .band-title, .title, .msg { fill: #e6edf3; }
      .band-sub, .sub, .label { fill: #9198a1; }
      .box, .box-ext { fill: #0d1117; stroke: #6e7681; }
      .box-user { fill: #e6edf3; }
      .user-title { fill: #0d1117; }
      .user-sub { fill: #3d444d; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .line-direct { stroke: #4493f8; }
      .head-direct, .label-direct { fill: #4493f8; }
      .life { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head-direct"/>
    </marker>
  </defs>

  <rect width="1110" height="840" class="bg"/>
  <rect x="170" y="100" width="920" height="330" rx="12" class="band band-cf"/>
  <text x="190" y="124" class="band-title" text-anchor="start">Cloudflare</text>
  <text x="282" y="124" class="band-sub" text-anchor="start">한국에서는 LA를 거칩니다</text>
  <rect x="170" y="470" width="920" height="250" rx="12" class="band band-mini"/>
  <text x="190" y="494" class="band-title" text-anchor="start">맥 미니</text>
  <text x="244" y="494" class="band-sub" text-anchor="start">서울</text>
  <rect x="130" y="20" width="710" height="50" rx="8" class="box-user"/>
  <text x="485.0" y="42.0" class="user-title" text-anchor="middle">한국의 브라우저</text>
  <text x="485.0" y="59.0" class="user-sub" text-anchor="middle">방문자, 회원, 사이트 주인</text>
  <rect x="880" y="20" width="190" height="50" rx="8" class="box-ext"/>
  <text x="975.0" y="42.0" class="title" text-anchor="middle">Toss, GitHub</text>
  <text x="975.0" y="59.0" class="sub" text-anchor="middle">결제 웹훅, 사이트 배포</text>
  <rect x="420" y="140" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="167.0" class="title" text-anchor="middle">엣지 Worker</text>
  <text x="515.0" y="184.0" class="sub" text-anchor="middle">&lt;site&gt;.naru.pub</text>
  <rect x="650" y="140" width="190" height="60" rx="8" class="box"/>
  <text x="745.0" y="167.0" class="title" text-anchor="middle">R2</text>
  <text x="745.0" y="184.0" class="sub" text-anchor="middle">사이트 파일, 미디어, 코드</text>
  <rect x="420" y="240" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="267.0" class="title" text-anchor="middle">Durable Objects</text>
  <text x="515.0" y="284.0" class="sub" text-anchor="middle">페이지뷰 기록</text>
  <rect x="420" y="340" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="367.0" class="title" text-anchor="middle">Standby 객체</text>
  <text x="515.0" y="384.0" class="sub" text-anchor="middle">상태 확인 cron, 알림</text>
  <text x="190" y="254" class="label-direct" text-anchor="start">naru.pub과</text>
  <text x="190" y="270" class="label-direct" text-anchor="start">sdk.naru.pub은</text>
  <text x="190" y="286" class="label-direct" text-anchor="start">Cloudflare를 거치지 않고</text>
  <text x="190" y="302" class="label-direct" text-anchor="start">맥 미니로 바로 연결</text>
  <rect x="190" y="510" width="190" height="60" rx="8" class="box"/>
  <text x="285.0" y="537.0" class="title" text-anchor="middle">Caddy :443</text>
  <text x="285.0" y="554.0" class="sub" text-anchor="middle">naru.pub · sdk.naru.pub</text>
  <rect x="420" y="510" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="537.0" class="title" text-anchor="middle">workerd</text>
  <text x="515.0" y="554.0" class="sub" text-anchor="middle">사이트마다 SQLite 하나</text>
  <rect x="650" y="510" width="190" height="60" rx="8" class="box"/>
  <text x="745.0" y="537.0" class="title" text-anchor="middle">Control plane</text>
  <text x="745.0" y="554.0" class="sub" text-anchor="middle">Next.js, blue/green</text>
  <rect x="880" y="510" width="190" height="60" rx="8" class="box"/>
  <text x="975.0" y="537.0" class="title" text-anchor="middle">nginx 게이트웨이</text>
  <text x="975.0" y="554.0" class="sub" text-anchor="middle">naru.pub</text>
  <rect x="190" y="620" width="190" height="60" rx="8" class="box"/>
  <text x="285.0" y="647.0" class="title" text-anchor="middle">백업 (launchd)</text>
  <text x="285.0" y="664.0" class="sub" text-anchor="middle">사이트 DB 매시, 전체 매일</text>
  <rect x="420" y="620" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="647.0" class="title" text-anchor="middle">PostgreSQL</text>
  <text x="515.0" y="664.0" class="sub" text-anchor="middle">계정, 결제, 토큰</text>
  <rect x="880" y="620" width="190" height="60" rx="8" class="box"/>
  <text x="975.0" y="647.0" class="title" text-anchor="middle">작업 워커</text>
  <text x="975.0" y="664.0" class="sub" text-anchor="middle">결제, 페이지뷰, 스크린샷</text>
  <rect x="190" y="760" width="190" height="60" rx="8" class="box-ext"/>
  <text x="285.0" y="787.0" class="title" text-anchor="middle">Backblaze B2</text>
  <text x="285.0" y="804.0" class="sub" text-anchor="middle">백업</text>
  <rect x="880" y="760" width="190" height="60" rx="8" class="box-ext"/>
  <text x="975.0" y="787.0" class="title" text-anchor="middle">SES, Sentry, Discord</text>
  <text x="975.0" y="804.0" class="sub" text-anchor="middle">메일, 오류, 알림</text>
