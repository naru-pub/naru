  <text x="368" y="439" class="label" text-anchor="start">상태 확인, 라우트 렌더</text>
  <path d="M560.0,510 L560.0,455 L745.0,455 L745.0,200" class="line" marker-end="url(#a)"/>
  <text x="753.0" y="300" class="label" text-anchor="start">코드, 복원 지점</text>
  <path d="M380,540 L420,540" class="line" marker-end="url(#a)"/>
  <path d="M325.0,570 L325.0,588 L975.0,588 L975.0,570" class="line" marker-end="url(#a)"/>
  <path d="M880,540 L840,540" class="line" marker-end="url(#a)"/>
  <path d="M650,540 L610,540" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M745.0,570 L745.0,642 L610,642" class="line" marker-end="url(#a)"/>
  <path d="M880,662 L610,662" class="line" marker-end="url(#a)"/>
  <path d="M285.0,680 L285.0,760" class="line" marker-end="url(#a)"/>
  <path d="M975.0,680 L975.0,760" class="line" marker-end="url(#a)"/>
</svg>
