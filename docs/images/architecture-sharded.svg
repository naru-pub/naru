  <text x="515.0" y="554.0" class="sub" text-anchor="middle">사이트 이름으로 샤드 선택</text>
  <rect x="190" y="620" width="190" height="60" rx="8" class="box"/>
  <text x="285.0" y="647.0" class="title" text-anchor="middle">nginx 게이트웨이</text>
  <text x="285.0" y="664.0" class="sub" text-anchor="middle">naru.pub</text>
  <rect x="420" y="620" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="647.0" class="title" text-anchor="middle">Control plane</text>
  <text x="515.0" y="664.0" class="sub" text-anchor="middle">Next.js, blue/green</text>
  <rect x="190" y="730" width="190" height="60" rx="8" class="box"/>
  <text x="285.0" y="757.0" class="title" text-anchor="middle">백업 (launchd)</text>
  <text x="285.0" y="774.0" class="sub" text-anchor="middle">사이트 DB 5분마다, 전체 매일</text>
  <rect x="420" y="730" width="190" height="60" rx="8" class="box"/>
  <text x="515.0" y="757.0" class="title" text-anchor="middle">PostgreSQL</text>
  <text x="515.0" y="774.0" class="sub" text-anchor="middle">계정, 결제, 토큰</text>
  <rect x="650" y="730" width="190" height="60" rx="8" class="box"/>
  <text x="745.0" y="757.0" class="title" text-anchor="middle">작업 워커</text>
  <text x="745.0" y="774.0" class="sub" text-anchor="middle">결제, 페이지뷰, 스크린샷</text>
  <rect x="880" y="730" width="190" height="60" rx="8" class="box"/>
  <text x="975.0" y="757.0" class="title" text-anchor="middle">워치독 (launchd)</text>
  <text x="975.0" y="774.0" class="sub" text-anchor="middle">멈추거나 4 GB 넘으면 재시작</text>
  <rect x="190" y="850" width="190" height="60" rx="8" class="box-ext"/>
