allowBuilds:
  # Jest's optional file watcher: it ships prebuilt binaries, so nothing here
  # needs its install script.
  "@parcel/watcher": false
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@fedify/fedify@2.4.0'
  - '@fedify/next@2.4.0'
  - '@fedify/postgres@2.4.0'
  - '@fedify/uri-template@2.4.0'
  - '@fedify/vocab-runtime@2.4.0'
  - '@fedify/vocab-tools@2.4.0'
  - '@fedify/vocab@2.4.0'
  - '@fedify/webfinger@2.4.0'
  # Next 16.4.3, taken before the release age: 16.4.0 has unauthenticated
  # RCEs (GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr) and a DoS
  # (GHSA-p3m5-59mp-jv5r), patched from 16.4.1.
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
  - '@next/eslint-plugin-next@16.4.3'
  - eslint-config-next@16.4.3
onlyBuiltDependencies:
  - "@sentry/cli"
  - esbuild
  - sharp
  - unrs-resolver
# Advisories in packages only reached through others, each lifted to its
# patched release within the major version its dependents ask for.
overrides:
  "dompurify@3": "^3.4.16"
  "@opentelemetry/core@2": "^2.8.0"
  "webpack@5": "^5.104.1"
