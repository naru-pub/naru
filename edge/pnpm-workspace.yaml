# The Worker is its own one-package workspace, apart from control-plane/.
# Some pnpm versions (as in Cloudflare's Workers Builds) refuse a workspace
# file without `packages`.
packages:
  - "."
allowBuilds:
  esbuild: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - workerd
# Miniflare's HTTP client, past advisories, within its major version.
# Also in package.json, the same: Workers Builds' pnpm 9 reads it only there
# and refuses the lockfile otherwise; pnpm 11 and later read it only here.
overrides:
  "undici@7": "^7.30.1"
