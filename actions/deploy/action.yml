name: Deploy to Naru
description: Deploy a static site directory to Naru using GitHub Actions OIDC.
author: naru-pub

inputs:
  site:
    description: Naru login name for the site to deploy. Leave out with `template`.
    required: false
  template:
    description: >-
      A Naru template's ID, from its edit page: publishes `dir` as the
      template's next version instead of deploying a site. The commit message
      becomes the version's changelog.
    required: false
  dir:
    description: Directory containing the built static site.
    required: true
  target:
    description: Target prefix inside the Naru site.
    required: false
    default: /
  endpoint:
    description: Naru control-plane endpoint.
    required: false
    default: https://naru.pub
  audience:
    description: GitHub OIDC audience. Defaults to the endpoint origin.
    required: false
  finalize:
    description: Whether to finalize and publish after upload.
    required: false
    default: "true"

outputs:
  deployment-id:
    description: Naru deployment id.
  deployed-files:
    description: Number of files deployed.
  uploaded-files:
    description: Number of new or changed files uploaded.
  deleted-files:
    description: Number of files deleted from the managed target.
  directory-size:
    description: Final Naru home directory size in bytes.
  site-url:
    description: Public URL of the deployed Naru site.

runs:
  using: node24
  main: index.js
