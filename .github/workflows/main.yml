name: main
on:
  push:
    branches:
      - main

jobs:
  image-control-plane:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
      packages: write
      attestations: write
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: arch
        run: echo arch=arm64 >> "$GITHUB_OUTPUT"
      # Two targets of one Dockerfile: the Next.js standalone server, and the
      # image worker and migrations run from, baked together
      # (docker-bake.hcl) so their shared dependency install runs once and the
      # rest side by side. Each is also loaded here for the smoke test below.
      # Named: `mise run deploy naru` in infra starts pulling on the server
      # once the jobs image is pushed.
      - name: Build and push the web and jobs images
        env:
          IMAGE: ghcr.io/${{ github.repository }}-control-plane
          TAG: git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          GIT_COMMIT: ${{ github.sha }}
          CACHE_ARCH: ${{ steps.arch.outputs.arch }}
        run: docker buildx bake --push --load --provenance=false
      # Runs the images just built as a deploy would. A deploy takes only a
      # commit whose whole run succeeded, so a failure here keeps it off the
      # server.
      - name: Smoke-test the images
        run: |
          image=ghcr.io/${{ github.repository }}-control-plane
          tag=git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          scripts/smoke-test-images.sh "$image:$tag" "$image-jobs:$tag"

  # TypeScript over the control plane, with the route types Next generates.
  # next build skips it (next.config.mjs) so that the image is not held up;
  # like the tests, it is part of the run a deploy checks.
  typecheck:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same pnpm as the Dockerfile.
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The payment tests: unit tests, then the database tests against a throwaway
  # PostgreSQL cluster the script starts itself. Part of the run a deploy
  # checks, so a payment regression never reaches the server.
  test-payments:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The PostgreSQL server binaries, installed in the background while the
      # dependencies are; "Wait for PostgreSQL" waits for it, failing with
      # apt's log if it failed.
      - name: Start installing PostgreSQL
        run: |
          {
            status=0
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-18 postgresql-18-cron postgresql-18-hll || status=$?
            echo "$status" >"$RUNNER_TEMP/postgresql.status"
          } >"$RUNNER_TEMP/postgresql.log" 2>&1 &
      # Same pnpm as the Dockerfile.
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:payments
      # Only the server binaries are needed; the script runs its own cluster
      # on a private socket.
      - name: Wait for PostgreSQL
        timeout-minutes: 5
        run: |
          while [[ ! -f "$RUNNER_TEMP/postgresql.status" ]]; do sleep 1; done
          if [[ "$(cat "$RUNNER_TEMP/postgresql.status")" != 0 ]]; then
            cat "$RUNNER_TEMP/postgresql.log"
            exit 1
          fi
      - run: pnpm test:payments:db
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/18/bin

      - run: bash scripts/test-payment-schedules-db.sh
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/18/bin

  # Everything else in the control plane: the unit suites, then the board and
  # site-data database tests, each against a throwaway PostgreSQL cluster and
  # a local edge Worker its script starts. Like test-payments, part of
  # the run a deploy checks.
  test-control-plane:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The PostgreSQL server binaries, installed in the background while the
      # dependencies are; "Wait for PostgreSQL" waits for it, failing with
      # apt's log if it failed.
      - name: Start installing PostgreSQL
        run: |
          {
            status=0
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-18 postgresql-18-hll || status=$?
            echo "$status" >"$RUNNER_TEMP/postgresql.status"
          } >"$RUNNER_TEMP/postgresql.log" 2>&1 &
      # Same pnpm as the Dockerfile.
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The committed SDK build and the /docs/sdk reference JSON are what
      # their generators make now; a TypeScript, TypeDoc or Prettier bump
      # that changes either shows up here rather than in a later commit.
      - run: pnpm sdk:check
      - run: pnpm sdk-reference:check
      - run: pnpm test:data
      - run: pnpm test:node
      - name: Wait for PostgreSQL
        timeout-minutes: 5
        run: |
          while [[ ! -f "$RUNNER_TEMP/postgresql.status" ]]; do sleep 1; done
          if [[ "$(cat "$RUNNER_TEMP/postgresql.status")" != 0 ]]; then
            cat "$RUNNER_TEMP/postgresql.log"
            exit 1
          fi
      # Site databases are Durable Objects: the database suites start the
      # edge Worker under `wrangler dev` (scripts/with-edge-worker.sh).
      - run: pnpm install --frozen-lockfile
        working-directory: edge
      # The object's list query against SQLite, without a Worker.
      - run: pnpm test
        working-directory: edge
      # The committed metered QuickJS is what quickjs/meter makes of the
      # installed variant's WebAssembly. The meter's build is kept between
      # runs: compiled from nothing, it takes ~20s.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/quickjs/meter -> target
      - run: pnpm check:meter
        working-directory: edge
      - run: pnpm test:board
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/18/bin
      - run: pnpm test:data:db
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/18/bin

  # The edge Worker as the mini runs it (edge/seoul/): built, served with
  # npm's workerd and checked (smoke.mjs), then with Naru's own workerd
  # (edge/seoul/workerd/), whose release binary.json names, with its step
  # budget set as on the mini, alone and as router and shards
  # (smoke-shards.mjs); then packed, router.capnp and all, with Naru's workerd for
  # `mise run deploy naru-sdk` in infra. macOS runners are Apple Silicon, like
  # the mini.
  build-sdk-seoul:
    defaults:
      run:
        working-directory: edge
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:seoul
      # Published by hand (edge/seoul/workerd/README.md); a missing asset, or
      # one whose sha256 is not binary.json's, fails the job. So does a
      # binary.json for another workerd than package.json's.
      - name: Download Naru's workerd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          field() { node -p "require('./seoul/workerd/binary.json').$1"; }
          pinned=$(node -p "require('./package.json').devDependencies.workerd")
          if [[ "$(field version)" != "$pinned" ]]; then
            echo "seoul/workerd/binary.json is for workerd $(field version), package.json pins $pinned: build and publish one (seoul/workerd/README.md)." >&2
            exit 1
          fi
          gh release download "$(field tag)" --repo "$GITHUB_REPOSITORY" \
            --pattern "$(field asset)" --dir "$RUNNER_TEMP/workerd"
          binary="$RUNNER_TEMP/workerd/$(field asset)"
          echo "$(field sha256)  $binary" | shasum -a 256 -c
          chmod 755 "$binary"
          echo "NARU_WORKERD_BIN=$binary" >> "$GITHUB_ENV"
      - run: node seoul/workerd/selftest.mjs "$NARU_WORKERD_BIN"
      - run: node seoul/smoke.mjs
      - run: node seoul/smoke-shards.mjs
      - run: |
          cp "$NARU_WORKERD_BIN" seoul/dist/workerd
          rm -rf seoul/dist/site-objects
          tar -czf naru-sdk-seoul-macos-arm64.tar.gz -C seoul/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: naru-sdk-seoul-macos-arm64
          path: edge/naru-sdk-seoul-macos-arm64.tar.gz
          retention-days: 30

  # @naru-pub/sdk (sdk/), as a project installs it: packed as npm would
  # publish it, installed in an empty folder outside the checkout, imported
  # there, and its files compared with the ones Naru serves for its version.
  # publish-sdk.yml runs the same before publishing.
  sdk-package:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sdk/scripts/check-package.sh "$RUNNER_TEMP/sdk"

  # @naru-pub/dev (naru-dev/), as a developer installs it: built and packed
  # once, as npm would publish it and as publish-naru-dev.yml does, ...
  naru-dev-tarball:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
        working-directory: edge
      - run: pnpm install --frozen-lockfile
        working-directory: naru-dev
      - run: pnpm typecheck
        working-directory: naru-dev
      - run: npm pack --silent --pack-destination .
        working-directory: naru-dev
      - uses: actions/upload-artifact@v4
        with:
          name: naru-dev-tarball
          path: naru-dev/naru-pub-dev-*.tgz
          retention-days: 7

  # ... then the tarball installed in an empty folder outside the checkout,
  # and its smoke test run there (the command on a fixture site's pages,
  # query, mutation, route and collection, and the testing API), on every
  # platform workerd ships a binary for, on the oldest Node it supports and
  # the current LTS.
  naru-dev-package:
    needs: naru-dev-tarball
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-15
          - macos-15-intel
          - windows-2025
        node: [20, 24]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners check out CRLF otherwise, which bash can't run.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: naru-dev-tarball
          path: naru-dev-tarball
      - run: naru-dev/scripts/check-package.sh "$PWD"/naru-dev-tarball/*.tgz
