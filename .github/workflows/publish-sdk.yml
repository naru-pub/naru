# Stages @naru-pub/sdk (sdk/) on npm when a tag sdk-v<version> is pushed,
# <version> being sdk/package.json's: the package is packed and checked as
# main.yml's sdk-package job checks it, and that very tarball is staged, with
# provenance, for a maintainer to approve with 2FA. A prerelease (1.1.0-dev.N,
# an SDK version still being built) goes under the dist-tag "dev", as npm
# requires of a prerelease. Signs in to npm as this workflow, by trusted
# publishing (sdk/README.md, "Publishing").
name: publish-sdk
on:
  push:
    tags:
      - "sdk-v*"

jobs:
  publish:
    permissions:
      contents: read
      # npm trusted publishing and provenance: the tarball is staged by this
      # workflow and signed as built here, from this commit.
      id-token: write
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag names the package's version
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "sdk-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME, but sdk/package.json is $version: tag sdk-v$version." >&2
            exit 1
          fi
      - run: sdk/scripts/check-package.sh "$RUNNER_TEMP/sdk"
      - name: Stage the checked tarball
        run: |
          tag=latest
          [[ "${GITHUB_REF_NAME#sdk-v}" == *-* ]] && tag=dev
          npm stage publish "$RUNNER_TEMP"/sdk/naru-pub-sdk-*.tgz --provenance --access public --tag "$tag"
